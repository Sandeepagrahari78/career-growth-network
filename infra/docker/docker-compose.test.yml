services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cgn
      POSTGRES_PASSWORD: cgn_test
      POSTGRES_DB: cgn_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgn -d cgn_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
    ports:
      - "127.0.0.1:9092:9092"

  object-store:
    image: chrislusf/seaweedfs:4.46
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:8333:8333"
