name: cgn-local-postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cgn_admin
      POSTGRES_PASSWORD: ${CGN_POSTGRES_PASSWORD:?CGN_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${CGN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - cgn-postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgn_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  cgn-postgres-data:
