apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-local-ingress-to-health-demo
  namespace: cgn-apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cgn-health-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3001
