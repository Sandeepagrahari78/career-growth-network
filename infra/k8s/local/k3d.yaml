apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cgn-local
servers: 1
agents: 1
image: rancher/k3s:v1.35.9-k3s1
kubeAPI:
  host: localhost
  hostIP: 127.0.0.1
  hostPort: "6550"
ports:
  - port: 127.0.0.1:8080:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:8443:443
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: 180s
  k3s:
    extraArgs:
      - arg: --cluster-cidr=10.244.0.0/16
        nodeFilters:
          - server:*
      - arg: --service-cidr=10.96.0.0/16
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
