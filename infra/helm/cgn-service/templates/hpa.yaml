{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cgn-service.fullname" . }}
  labels:
    {{- include "cgn-service.selectorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cgn-service.fullname" . }}
  minReplicas: {{ required "autoscaling.minReplicas is required when autoscaling is enabled" .Values.autoscaling.minReplicas }}
  maxReplicas: {{ required "autoscaling.maxReplicas is required when autoscaling is enabled" .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
