{{- if and .Values.workloadIdentity.awsIrsa.enabled (not .Values.serviceAccount.create) }}
{{- fail "workloadIdentity.awsIrsa requires serviceAccount.create=true so the chart owns the annotated ServiceAccount" }}
{{- end }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cgn-service.serviceAccountName" . }}
  labels:
    {{- include "cgn-service.selectorLabels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.workloadIdentity.awsIrsa.enabled }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.workloadIdentity.awsIrsa.enabled }}
    eks.amazonaws.com/role-arn: {{ required "workloadIdentity.awsIrsa.roleArn is required when AWS IRSA is enabled" .Values.workloadIdentity.awsIrsa.roleArn | quote }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
