nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: cgn-service
  tag: dev
  pullPolicy: IfNotPresent

container:
  port: 3000

service:
  type: ClusterIP
  port: 3000

podLabels: {}

env: []

resources: {}

probes:
  enabled: false
  startup:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
    successThreshold: 1
  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: null
  maxReplicas: null
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

disruptionBudget:
  enabled: false
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

workloadIdentity:
  awsIrsa:
    enabled: false
    roleArn: ""
