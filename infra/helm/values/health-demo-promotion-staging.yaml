nameOverride: cgn-health-demo
replicaCount: 1

image:
  repository: cgn-health-demo
  tag: "sha-__RELEASE_SHA__"
  pullPolicy: IfNotPresent

container:
  port: 3001

service:
  type: ClusterIP
  port: 3001

podLabels:
  cgn.io/environment: staging

env:
  - name: PORT
    value: "3001"

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
