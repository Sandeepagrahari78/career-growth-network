apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgn-health-demo
  labels:
    app.kubernetes.io/name: cgn-health-demo
    app.kubernetes.io/part-of: cgn
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cgn-health-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cgn-health-demo
        app.kubernetes.io/part-of: cgn
    spec:
      automountServiceAccountToken: false
      containers:
        - name: health-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
