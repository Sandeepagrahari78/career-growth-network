name: Helm Promotion Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/helm/**"
      - "config/gitops/helm-promotion.v1.json"
      - "scripts/ci/validate-helm-promotion.mjs"
      - "scripts/infra/render-helm-promotion.mjs"
      - "tests/contracts/helm-promotion.contract.test.mjs"
      - ".github/workflows/helm-promotion.yml"
  push:
    branches: [main]
    paths:
      - "infra/helm/**"
      - "config/gitops/helm-promotion.v1.json"
      - "scripts/ci/validate-helm-promotion.mjs"
      - "scripts/infra/render-helm-promotion.mjs"
      - "tests/contracts/helm-promotion.contract.test.mjs"
      - ".github/workflows/helm-promotion.yml"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved main commit SHA to promote
        required: true
        type: string
      confirmation:
        description: Type PROMOTE-PRODUCTION-VALUES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: helm-promotion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Helm lint render and immutable artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Validate promotion contract
        run: pnpm ci:helm

      - id: release
        name: Resolve render SHA
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.release_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="$DISPATCH_SHA"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="$PR_HEAD_SHA"
          else
            sha="$GITHUB_SHA"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Render staging and production values from one immutable SHA
        run: |
          node scripts/infra/render-helm-promotion.mjs \
            --release-sha "${{ steps.release.outputs.sha }}" \
            --output-dir .local/helm

      - name: Helm lint chart
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.6 \
            lint infra/helm/health-demo

      - name: Render staging manifest
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.6 \
            template cgn-health-demo infra/helm/health-demo \
            --namespace cgn-apps \
            --values .local/helm/staging-values.yaml \
            > .local/helm/staging-rendered.yaml

      - name: Render production candidate manifest
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.6 \
            template cgn-health-demo infra/helm/health-demo \
            --namespace cgn-apps \
            --values .local/helm/production-values.yaml \
            > .local/helm/production-rendered.yaml

      - name: Upload Helm validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-promotion-validation-${{ steps.release.outputs.sha }}
          path: .local/helm/
          if-no-files-found: error
          retention-days: 14

  promotion-dry-run:
    name: Owner-approved production values promotion dry run
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CGN_RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Verify owner and confirmation
        shell: bash
        env:
          CGN_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_ACTOR" = "Sandeepagrahari78"
          test "$CGN_CONFIRMATION" = "PROMOTE-PRODUCTION-VALUES"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify exact approved main SHA
        shell: bash
        run: |
          git fetch origin main --no-tags
          node scripts/ci/verify-release-sha.mjs "$CGN_RELEASE_SHA"

      - name: Render owner-approved promotion candidate
        run: |
          node scripts/infra/render-helm-promotion.mjs \
            --release-sha "$CGN_RELEASE_SHA" \
            --output-dir .local/helm-approved

      - name: Render exact production candidate with Helm
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/helm:3.18.6 \
            template cgn-health-demo infra/helm/health-demo \
            --namespace cgn-apps \
            --values .local/helm-approved/production-values.yaml \
            > .local/helm-approved/production-rendered.yaml

      - name: Upload approved promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-production-values-dry-run-${{ inputs.release_sha }}
          path: .local/helm-approved/
          if-no-files-found: error
          retention-days: 90
