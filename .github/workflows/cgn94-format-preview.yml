name: CGN 94 Format Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/validate-database-migration-job.mjs"
      - ".github/workflows/cgn94-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Format CGN-94 validator
        run: pnpm dlx prettier@3.6.2 --write scripts/ci/validate-database-migration-job.mjs

      - name: Print formatted validator
        run: |
          echo "=== VALIDATOR START ==="
          cat scripts/ci/validate-database-migration-job.mjs
          echo "=== VALIDATOR END ==="
