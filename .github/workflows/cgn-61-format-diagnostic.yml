name: CGN-61 Temporary Prettier Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/ci/validate-workload-identity.mjs
      - tests/contracts/workload-identity.contract.test.mjs
      - .github/workflows/cgn-61-format-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - name: Print formatted source (temporary non-secret diagnostic)
        run: |
          pnpm dlx prettier@3.6.2 --write scripts/ci/validate-workload-identity.mjs tests/contracts/workload-identity.contract.test.mjs
          echo "CGN61_FORMAT_SCRIPT_BEGIN"
          cat scripts/ci/validate-workload-identity.mjs
          echo "CGN61_FORMAT_SCRIPT_END"
          echo "CGN61_FORMAT_TEST_BEGIN"
          cat tests/contracts/workload-identity.contract.test.mjs
          echo "CGN61_FORMAT_TEST_END"
