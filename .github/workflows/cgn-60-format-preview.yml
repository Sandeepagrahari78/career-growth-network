name: CGN 60 Format Preview

on:
  push:
    branches:
      - CGN-60-hpa-pdb-defaults
    paths:
      - "scripts/ci/validate-autoscaling-disruption.mjs"
      - "tests/contracts/autoscaling-disruption.contract.test.mjs"
      - ".github/workflows/cgn-60-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Format preview
        shell: bash
        run: |
          npx --yes prettier@3.6.2 --write scripts/ci/validate-autoscaling-disruption.mjs tests/contracts/autoscaling-disruption.contract.test.mjs
          git diff --no-ext-diff --unified=200 -- scripts/ci/validate-autoscaling-disruption.mjs tests/contracts/autoscaling-disruption.contract.test.mjs
