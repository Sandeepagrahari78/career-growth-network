name: CGN 93 Format Preview

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/validate-helm-promotion.mjs"
      - "tests/contracts/helm-promotion.contract.test.mjs"
      - ".github/workflows/cgn93-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Format the two CGN-93 files
        run: |
          pnpm dlx prettier@3.6.2 --write             scripts/ci/validate-helm-promotion.mjs             tests/contracts/helm-promotion.contract.test.mjs

      - name: Print formatted validator
        run: |
          echo "=== VALIDATOR START ==="
          cat scripts/ci/validate-helm-promotion.mjs
          echo "=== VALIDATOR END ==="

      - name: Print formatted test
        run: |
          echo "=== TEST START ==="
          cat tests/contracts/helm-promotion.contract.test.mjs
          echo "=== TEST END ==="
