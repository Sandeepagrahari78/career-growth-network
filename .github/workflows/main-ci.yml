name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  source-security:
    name: Main source security revalidation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - id: gitleaks
        name: Gitleaks secret scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - id: semgrep
        name: Semgrep CE
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --config=auto --config=config/semgrep/cgn.yml --error

      - id: trivy_fs
        name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Enforce main source security gate
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_FS_OUTCOME: ${{ steps.trivy_fs.outcome }}
        run: |
          test "$GITLEAKS_OUTCOME" = "success"
          test "$SEMGREP_OUTCOME" = "success"
          test "$TRIVY_FS_OUTCOME" = "success"

  revalidate:
    name: Main revalidation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Audit owner-controlled PR entry to main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_ACTOR" = "Sandeepagrahari78"
          for attempt in {1..10}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'length')"
            if [ "$count" -gt 0 ]; then
              echo "Main commit is associated with a reviewed pull request."
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Main entry audit failed: no associated pull request found."
              exit 1
            fi
            sleep 3
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Engineering Memory gate
        run: pnpm memory:check
        env:
          CGN_BEFORE_SHA: ${{ github.event.before }}

      - name: Synchronization regression proof
        run: pnpm demo:sync

      - name: Quality gates
        run: pnpm ci:quick

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Revalidate zero-budget Terraform
        shell: bash
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/environments/local init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/local validate
          terraform -chdir=infra/terraform/environments/local plan -input=false -lock=false -refresh=false -var-file=staging.tfvars

      - name: Revalidate local network/security baseline
        run: node scripts/ci/validate-local-network.mjs

      - name: Build immutable candidate image
        run: docker build -f services/health-demo/Dockerfile -t cgn-health-demo:${{ github.sha }} .

      - id: trivy_image
        name: Trivy candidate image vulnerability gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-health-demo:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate candidate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-health-demo:${{ github.sha }}
          format: cyclonedx
          output: sbom-health-demo.cdx.json
          exit-code: "0"

      - name: Upload candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-main-health-demo-${{ github.sha }}
          path: sbom-health-demo.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce candidate container security gate
        shell: bash
        env:
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: |
          echo "TRIVY_IMAGE_OUTCOME=$TRIVY_IMAGE_OUTCOME"
          test "$TRIVY_IMAGE_OUTCOME" = "success"

      - name: Smoke candidate image
        shell: bash
        run: |
          docker run -d --name cgn-health-demo -p 127.0.0.1:3001:3001 cgn-health-demo:${{ github.sha }}
          trap 'docker rm -f cgn-health-demo >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:3001/ready | grep -q '"status":"ready"'
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-health-demo
          exit 1

      - name: Revalidate shared integration dependencies
        run: node scripts/ci/integration-stack-smoke.mjs

      - name: Revalidate end-to-end and performance smoke
        shell: bash
        run: |
          docker run -d --name cgn-main-validation -p 127.0.0.1:3001:3001 cgn-health-demo:${{ github.sha }}
          trap 'docker rm -f cgn-main-validation >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ready >/dev/null; then
              BASE_URL=http://127.0.0.1:3001 node tests/e2e/health-demo.e2e.mjs
              docker run --rm --network host \
                -e BASE_URL=http://127.0.0.1:3001 \
                -v "$PWD:/work" \
                grafana/k6:0.54.0 \
                run /work/tests/performance/health-smoke.js
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-main-validation
          exit 1
