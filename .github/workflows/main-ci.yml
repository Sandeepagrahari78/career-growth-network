name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  revalidate:
    name: Main revalidation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Engineering Memory gate
        run: pnpm memory:check
        env:
          CGN_BEFORE_SHA: ${{ github.event.before }}

      - name: Synchronization regression proof
        run: pnpm demo:sync

      - name: Quality gates
        run: pnpm ci:quick

      - name: Build immutable candidate image
        run: docker build -f services/health-demo/Dockerfile -t cgn-health-demo:${{ github.sha }} .

      - id: trivy_image
        name: Trivy candidate image vulnerability gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-health-demo:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate candidate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-health-demo:${{ github.sha }}
          format: cyclonedx
          output: sbom-health-demo.cdx.json
          exit-code: "0"

      - name: Upload candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-main-health-demo-${{ github.sha }}
          path: sbom-health-demo.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce candidate container security gate
        shell: bash
        env:
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: |
          echo "TRIVY_IMAGE_OUTCOME=$TRIVY_IMAGE_OUTCOME"
          test "$TRIVY_IMAGE_OUTCOME" = "success"

      - name: Smoke candidate image
        shell: bash
        run: |
          docker run -d --name cgn-health-demo -p 3001:3001 cgn-health-demo:${{ github.sha }}
          trap 'docker rm -f cgn-health-demo >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-health-demo
          exit 1
