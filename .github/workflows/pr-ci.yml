name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected code
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.detect.outputs.docker }}
      dockerCount: ${{ steps.docker_services.outputs.count }}
      dockerMatrix: ${{ steps.docker_services.outputs.matrix }}
      backend: ${{ steps.detect.outputs.backend }}
      contracts: ${{ steps.detect.outputs.contracts }}
      infra: ${{ steps.detect.outputs.infra }}
      k8s: ${{ steps.detect.outputs.k8s }}
      postgres: ${{ steps.detect.outputs.postgres }}
      docsOnly: ${{ steps.detect.outputs.docsOnly }}
      integration: ${{ steps.detect.outputs.integration }}
      e2e: ${{ steps.detect.outputs.e2e }}
      platformTemplate: ${{ steps.detect.outputs.platformTemplate }}
      performance: ${{ steps.detect.outputs.performance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - id: detect
        name: Detect changed paths
        run: node scripts/ci/detect-changes.mjs
        env:
          CGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - id: docker_services
        name: Detect changed Docker services
        run: node scripts/ci/changed-docker-services.mjs
        env:
          CGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  context:
    name: Context and Engineering Memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify Jira-scoped branch
        run: pnpm ci:verify-branch

      - name: Generate CI agent context
        shell: bash
        run: |
          TICKET="$(echo "${GITHUB_HEAD_REF}" | grep -oE '^CGN-[0-9]+' || true)"
          if [ -n "$TICKET" ]; then
            pnpm agent:context --ticket "$TICKET" --domain cicd
          else
            echo "Special ci/hotfix branch: context ticket generation skipped."
          fi

      - name: Engineering Memory gate
        run: pnpm memory:check
        env:
          CGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Require matching ticket handoff for source changes
        run: node scripts/ci/verify-agent-handoff.mjs
        env:
          CGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Enforce reviewed Jira web or Android platform scope
        run: node scripts/ci/verify-platform-scope.mjs
        env:
          CGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  quality:
    name: Format lint types unit contract build
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Synchronization regression proof
        run: pnpm demo:sync

      - name: Quality gates
        run: pnpm ci:quick

  security:
    name: Dependency secret SAST vulnerability scans
    needs: [context]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - id: gitleaks
        name: Gitleaks secret scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: osv
        name: OSV dependency vulnerability scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - id: semgrep
        name: Semgrep CE
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep --config=auto --config=config/semgrep/cgn.yml --error

      - id: trivy_fs
        name: Trivy filesystem scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload OSV scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-pr-${{ github.event.pull_request.number }}
          path: osv-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce aggregate source security gate
        if: always()
        shell: bash
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          TRIVY_FS_OUTCOME: ${{ steps.trivy_fs.outcome }}
        run: |
          status=0
          for check in GITLEAKS_OUTCOME OSV_OUTCOME SEMGREP_OUTCOME TRIVY_FS_OUTCOME; do
            value="${!check}"
            echo "$check=$value"
            if [ "$value" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

  terraform:
    name: Infrastructure zero-budget validation
    needs: [changes, context]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform/environments/local init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/environments/local validate

      - name: Validate local network/security baseline
        run: node scripts/ci/validate-local-network.mjs

      - name: Plan local-dev
        run: terraform -chdir=infra/terraform/environments/local plan -input=false -lock=false -refresh=false -var-file=dev.tfvars

      - name: Plan local-staging
        run: terraform -chdir=infra/terraform/environments/local plan -input=false -lock=false -refresh=false -var-file=staging.tfvars

      - name: Reject unsupported cloud/production environment
        shell: bash
        run: |
          if terraform -chdir=infra/terraform/environments/local plan -input=false -lock=false -refresh=false -var='environment=production' -var='execution_mode=cloud'; then
            echo "Unsafe production/cloud mode unexpectedly passed."
            exit 1
          fi
          echo "Unsupported production/cloud mode rejected as expected."

  local-k8s:
    name: Local Kubernetes create smoke destroy
    needs: [changes, quality, terraform]
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Setup kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.35.9"

      - name: Install pinned k3d
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            -o /tmp/k3d-linux-amd64 \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          curl --fail --location --silent --show-error \
            -o /tmp/checksums.txt \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/checksums.txt
          expected_sha="$(awk '$2 ~ /k3d-linux-amd64$/ {print $1}' /tmp/checksums.txt)"
          test -n "$expected_sha"
          echo "$expected_sha  /tmp/k3d-linux-amd64" | sha256sum --check -
          sudo install -m 0755 /tmp/k3d-linux-amd64 /usr/local/bin/k3d
          k3d version

      - name: Create CGN local cluster
        run: bash scripts/infra/k3d-up.sh

      - name: Prove service discovery and NetworkPolicy enforcement
        run: bash scripts/infra/k3d-smoke.sh

      - name: Install pinned Helm
        shell: bash
        env:
          HELM_VERSION: v3.18.6
        run: |
          archive="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            -o "/tmp/$archive" \
            "https://get.helm.sh/$archive"
          curl --fail --location --silent --show-error \
            -o "/tmp/$archive.sha256sum" \
            "https://get.helm.sh/$archive.sha256sum"
          expected_sha="$(awk '{print $1}' "/tmp/$archive.sha256sum")"
          test -n "$expected_sha"
          echo "$expected_sha  /tmp/$archive" | sha256sum --check -
          tar -xzf "/tmp/$archive" -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Build platform-template image
        run: docker build -f services/platform-template/Dockerfile -t cgn-platform-template:cgn34 .

      - name: Deploy platform-template into temporary local staging namespace
        run: node scripts/infra/k3d-platform-template-smoke.mjs

      - name: Destroy CGN local cluster
        if: always()
        shell: bash
        run: |
          if command -v k3d >/dev/null 2>&1; then
            bash scripts/infra/k3d-down.sh
          else
            echo "k3d is unavailable; no local cluster can exist."
          fi

  local-postgres:
    name: PostgreSQL init migrate backup restore
    needs: [changes, quality]
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Generate ephemeral database password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "CGN_POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start local PostgreSQL
        run: node scripts/infra/postgres-local.mjs up

      - name: Verify service database ownership
        run: node scripts/infra/postgres-local.mjs verify

      - name: Reject unknown service migration
        shell: bash
        run: |
          if node scripts/infra/postgres-local.mjs migrate unknown-service tests/fixtures/postgres/migration-smoke.sql; then
            echo "Unknown service migration unexpectedly succeeded."
            exit 1
          fi
          echo "Unknown service migration rejected as expected."

      - name: Run owner-scoped migration smoke
        run: node scripts/infra/postgres-local.mjs migration-smoke

      - name: Prove backup command
        shell: bash
        run: |
          node scripts/infra/postgres-local.mjs backup identity .local/backups/cgn_identity.dump
          test -s .local/backups/cgn_identity.dump

      - name: Prove backup and restore
        run: node scripts/infra/postgres-local.mjs backup-restore-smoke

      - name: Destroy local PostgreSQL and volume
        if: always()
        run: node scripts/infra/postgres-local.mjs reset

  docker:
    name: Docker build and security ${{ matrix.service }}
    needs: [changes, quality, security]
    if: needs.changes.outputs.dockerCount != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.dockerMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build changed service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: cgn-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.service }}

      - id: trivy_image
        name: Trivy container image vulnerability gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cgn-${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          exit-code: "0"

      - name: Upload container SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Run health-demo container smoke
        if: matrix.service == 'health-demo'
        shell: bash
        run: |
          docker run -d --name cgn-health-demo -p 3001:3001 cgn-health-demo:${{ github.sha }}
          trap 'docker rm -f cgn-health-demo >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health | grep -q '"status":"ok"'; then
              echo "Container health smoke passed."
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-health-demo
          exit 1

      - name: Run platform-template Docker acceptance
        if: matrix.service == 'platform-template'
        env:
          CGN_TEMPLATE_IMAGE: cgn-platform-template:${{ github.sha }}
        run: pnpm --filter @cgn/platform-template test:docker

      - name: Enforce container security gate
        if: always()
        shell: bash
        env:
          TRIVY_IMAGE_OUTCOME: ${{ steps.trivy_image.outcome }}
        run: |
          echo "TRIVY_IMAGE_OUTCOME=$TRIVY_IMAGE_OUTCOME"
          test "$TRIVY_IMAGE_OUTCOME" = "success"

  integration:
    name: Integration dependency stack
    needs: [changes, quality]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Start and verify shared integration dependencies
        run: node scripts/ci/integration-stack-smoke.mjs

  e2e:
    name: End-to-end deployment smoke
    needs: [changes, quality]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build health-demo deployment artifact
        run: docker build -f services/health-demo/Dockerfile -t cgn-health-demo:e2e .

      - name: Run end-to-end HTTP journey
        shell: bash
        run: |
          docker run -d --name cgn-e2e -p 127.0.0.1:3001:3001 cgn-health-demo:e2e
          trap 'docker rm -f cgn-e2e >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ready | grep -q '"status":"ready"'; then
              BASE_URL=http://127.0.0.1:3001 node tests/e2e/health-demo.e2e.mjs
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-e2e
          exit 1

      - name: Build and run platform-template Docker acceptance
        if: needs.changes.outputs.platformTemplate == 'true'
        shell: bash
        env:
          CGN_TEMPLATE_IMAGE: cgn-platform-template:e2e
        run: |
          docker build -f services/platform-template/Dockerfile -t cgn-platform-template:e2e .
          node services/platform-template/test/docker-smoke.mjs

  performance-smoke:
    name: Controlled k6 performance smoke
    needs: [changes, quality]
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build health-demo performance artifact
        run: docker build -f services/health-demo/Dockerfile -t cgn-health-demo:performance .

      - name: Run k6 smoke against the deployment artifact
        shell: bash
        run: |
          docker run -d --name cgn-performance -p 127.0.0.1:3001:3001 cgn-health-demo:performance
          trap 'docker rm -f cgn-performance >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ready >/dev/null; then
              docker run --rm --network host \
                -e BASE_URL=http://127.0.0.1:3001 \
                -v "$PWD:/work" \
                grafana/k6:0.54.0 \
                run /work/tests/performance/health-smoke.js
              exit 0
            fi
            sleep 1
          done
          docker logs cgn-performance
          exit 1

  gate:
    name: PR quality gate summary
    if: always()
    needs:
      - changes
      - context
      - quality
      - security
      - terraform
      - local-k8s
      - local-postgres
      - docker
      - integration
      - e2e
      - performance-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all relevant gates green
        shell: bash
        run: |
          echo "context=${{ needs.context.result }}"
          echo "quality=${{ needs.quality.result }}"
          echo "security=${{ needs.security.result }}"
          echo "terraform=${{ needs.terraform.result }}"
          echo "local-k8s=${{ needs.local-k8s.result }}"
          echo "local-postgres=${{ needs.local-postgres.result }}"
          echo "docker=${{ needs.docker.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "performance-smoke=${{ needs.performance-smoke.result }}"
          test "${{ needs.context.result }}" = "success"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.terraform.result }}" = "success" -o "${{ needs.terraform.result }}" = "skipped"
          test "${{ needs.local-k8s.result }}" = "success" -o "${{ needs.local-k8s.result }}" = "skipped"
          test "${{ needs.local-postgres.result }}" = "success" -o "${{ needs.local-postgres.result }}" = "skipped"
          test "${{ needs.docker.result }}" = "success" -o "${{ needs.docker.result }}" = "skipped"
          test "${{ needs.integration.result }}" = "success" -o "${{ needs.integration.result }}" = "skipped"
          test "${{ needs.e2e.result }}" = "success" -o "${{ needs.e2e.result }}" = "skipped"
          test "${{ needs.performance-smoke.result }}" = "success" -o "${{ needs.performance-smoke.result }}" = "skipped"
