name: CGN301 temporary formatting preview

on:
  push:
    branches: ["CGN-301-fast-delivery-v2"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 
        with:
          node-version: 22
      - name: Format and print source as base64 (read-only runner)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm dlx prettier@3.6.2 --write scripts/ci/ticket-check.mjs tests/contracts/cgn-fast-delivery-v2.contract.test.mjs
          echo "CGN301_BEGIN_CLI"
          base64 -w 76 scripts/ci/ticket-check.mjs
          echo "CGN301_END_CLI"
          echo "CGN301_BEGIN_TEST"
          base64 -w 76 tests/contracts/cgn-fast-delivery-v2.contract.test.mjs
          echo "CGN301_END_TEST"
